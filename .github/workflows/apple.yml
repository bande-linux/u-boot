name: apple

on:
  push:
    branches: [ main, 'prep/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, bande]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build apple_m1_defconfig
        run: |
          python3 -m venv /tmp/uboot-venv
          /tmp/uboot-venv/bin/pip install -q setuptools pyelftools
          export PATH=/tmp/uboot-venv/bin:$PATH
          make apple_m1_defconfig
          make -j8
          ls -l u-boot-nodtb.bin

      - uses: actions/upload-artifact@v7
        with:
          name: u-boot
          path: u-boot-nodtb.bin
